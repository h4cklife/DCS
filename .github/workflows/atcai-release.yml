# ---------------------------------------------------------------------------
# Publishes an ATCAI release.
#
# Triggered by pushing a tag that starts with "atcai-v":
#
#     git tag atcai-v1.0.0
#     git push origin atcai-v1.0.0
#
# It runs the tests, builds ATCAI-Manager.exe on a clean Windows machine, and
# creates a GitHub Release with the exe attached and CHANGELOG.md as the notes.
#
# Tags are prefixed with the module name because this repository holds several
# DCS modules; another module's release must not collide with ATCAI's.
#
# Deliberately has no "paths" filter: path filters compare changed files, and a
# tag points at a commit that was already pushed, so a filtered workflow would
# never run for a tag.
#
# Why Windows: PyInstaller cannot cross-compile, so a Windows .exe must be built
# from Windows Python. Building here means you don't need it installed locally.
# ---------------------------------------------------------------------------

name: ATCAI release

on:
  push:
    tags: ["atcai-v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: ATCAI

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest pyinstaller
      - run: python -m pytest tests -v          # never ship something failing
      - run: python manager/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: ATCAI-Manager
          # Artifact paths are relative to the checkout, not working-directory.
          path: ATCAI/dist/ATCAI-Manager.exe

  release:
    needs: build
    runs-on: ubuntu-latest        # just publishing; no need for Windows here
    permissions:
      contents: write             # required to create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATCAI-Manager
      - uses: softprops/action-gh-release@v2
        with:
          files: ATCAI-Manager.exe
          body_path: ATCAI/CHANGELOG.md
